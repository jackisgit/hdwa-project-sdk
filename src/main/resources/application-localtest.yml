    #    sdk
    primary:
      #      sentinel:
      #        master: mymaster
      #        nodes:
      host: 10.1.106.166
      port: 16379
      timeout: 1000000
      database: 5
      jedis:
        pool:
          # 连接池最大连接数（使用负值表示没有限制）
          max-active: 16
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池中的最小空闲连接
          min-idle: 0
