    nacos:
      application: seata-server
      namespace: ${nacos.namespace:local}
      server-addr: ${nacos.address:localhost:8848}
      group : DEFAULT_GROUP
      userName:
      password:

  config:
    type: nacos
    nacos:
      serverAddr: ${nacos.address:localhost:8848}
      namespace: ${nacos.namespace:local}
      group: SEATA_GROUP
      cluster: default
      userName:
      password:
      data-id: seataServer.properties


# 普罗米修斯监控
management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  cloud:
    nacos:
      discovery:
        metadata:
          developer: ray
    stream:
      default-binder: kafka
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # always never
      comment-prefix: '#'

#  datasource:
#    url: jdbc:mysql://10.199.205.60:3306/hdwa_ibms_alarm?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
#    driver-class-name: com.mysql.jdbc.Driver
#    username: root
#    password: hdwadbajd0520

  kafka:
    enable: true
    bootstrapServers: 10.199.87.63:19092,10.199.87.79:19092,10.199.87.85:19092
    producer:
      # 发生错误后，消息重发的次数。
      retries: 2
      #当有多个消息需要被发送到同一个分区时，生产者会把它们放在同一个批次里。该参数指定了一个批次可以使用的内存大小，按照字节数计算。
      batch-size: 65536
      # 设置生产者内存缓冲区的大小。
      buffer-memory: 33554432
      # acks=0 ： 生产者在成功写入消息之前不会等待任何来自服务器的响应。
      # acks=1 ： 只要集群的首领节点收到消息，生产者就会收到一个来自服务器成功响应。
      # acks=all ：只有当所有参与复制的节点全部收到消息时，生产者才会收到一个来自服务器的成功响应。
      acks: 1
      #      properties:
      #        max.request.size: 50000000
      #        security.protocol: SSL
      #        ssl.endpoint.identification.algorithm:
      linger-ms: 500
      topics: persage.alarm.edge2alarm
    consumer:
      # 自动提交的时间间隔 在spring boot 2.X 版本中这里采用的是值的类型为Duration 需要符合特定的格式，如1S,1M,2H,5D
      auto-commit-interval: 1S
      # 该属性指定了消费者在读取一个没有偏移量的分区或者偏移量无效的情况下该作何处理：
      # latest（默认值）在偏移量无效的情况下，消费者将从最新的记录开始读取数据（在消费者启动之后生成的记录）
      # earliest ：在偏移量无效的情况下，消费者将从起始位置读取分区的记录
      auto-offset-reset: latest
      # 是否自动提交偏移量，默认值是true,为了避免出现重复数据和数据丢失，可以把它设置为false,然后手动提交偏移量
      enable-auto-commit: false
      # ------------------group-id，需修改
      group-id: ibms-project-alarm-Pj3304020130
      topics: persage.alarm.alarm2edge
      #      properties:
      #        security.protocol: SSL
      #        ssl.endpoint.identification.algorithm:
      max-poll-records: 5000
    listener:
      # 在侦听器容器中运行的线程数。
      concurrency: 5
      #listner负责ack，每调用一次，就立即commit
      ack-mode: manual_immediate
      missing-topics-fatal: false

