defaultDs:
  string:
    url: ${hdwa-project-sdk.datasource.url}
    username: ${hdwa-project-sdk.datasource.username}
    password: ${hdwa-project-sdk.datasource.password}
    driverClassName: ${hdwa-project-sdk.datasource.driver}
    connection-init-sqls: ${hdwa-project-sdk.datasource.connection}
    validationQuery: ${hdwa-project-sdk.datasource.vaildQuery}
    filters: stat
  int:
    initialSize: ${hdwa-project-sdk.datasource.minSize}
    minIdle: ${hdwa-project-sdk.datasource.minSize}
    maxActive: ${hdwa-project-sdk.datasource.maxSize}
    maxPoolPreparedStatementPerConnectionSize: 20
  long:
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
  boolean:
    testWhileIdle: true
    testOnBorrow: ${hdwa-project-sdk.datasource.testOnBorrow}
    testOnReturn: false
    poolPreparedStatements: true


mybatis:
  mapper-locations: classpath:/mapper/**/*Mapper.xml

xxl-job:
