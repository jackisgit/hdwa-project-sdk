    log-path: logs/jpaas-job #默认为 logs/applogs/xxl-job/jobhandler
    log-retention-days: 10 #默认为 10
    #ip: #默认为空
    #port: 7678 #默认为 9999

redxun:
  #聚合文档
  swagger:
    enabled: true
    title: 云端报警服务
    description: 云端报警服务接口文档
    version: 1.0
    base-package: com.hdwa.sdk.controller
