server:
  port: 7777
  tomcat:
    accept-count: 1000
    max-threads: 1000
    max-connections: 10000
    min-spare-threads: 100

#项目信息
project:
  groupCode: WD

#数据文件目录
dirName:
  config: config
  point: point
  physicalWorld: physical_world
  ibmsLogicalGroup: ibms_logical_group
  ibmsPhysicalWorld: ibms_physical_world
  temp: temp

#默认用户表示 ，用于报警记录的创建人
systemId: system

#每天23点全量更新一次报警定义
alarmDefineCron: 0 0 23 * * ?

spring:
  datasource:
    username: root
    password: wanda@1234
    type: com.alibaba.druid.pool.DruidDataSource
    initial-size: 5  # 初始化大小
    min-idle: 5  # 最小
    max-active: 20  # 最大
    max-wait: 60000  # 配置获取连接等待超时的时间
    time-between-eviction-runs-millis: 60000  # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
    min-evictable-idle-time-millis: 300000  # 指定一个空闲连接最少空闲多久后可被清除，单位是毫秒
    validationQuery: select 'x'
    test-while-idle: true  # 当连接空闲时，是否执行连接测试
    test-on-borrow: false  # 当从连接池借用连接时，是否测试该连接
    test-on-return: false  # 在连接归还到连接池时是否测试该连接
    filters: config,wall,stat  # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
    poolPreparedStatements: true # 打开PSCache，并且指定每个连接上PSCache的大小
    MaxPoolPreparedStatementPerConnectionSize: 20
    maxOpenPreparedStatements: 50
    # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
    connectionProperties: druid.stat.slowSqlMillis=500;druid.stat.logSlowSql=true;config.decrypt=false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # always never
      comment-prefix: '#'

  kafka:
    #sdk配置
    producer:
      retries: 2
      batch-size: 65536
      properties:
        linger:
          #提交延时 当生产端积累的消息达到batch-size或接收到消息linger.ms后,生产者就会将消息提交给kafka   linger.ms为0表示每接收到一条消息就提交给kafka,这时候batch-size其实就没用了
          ms: 1000
      #生产端缓冲区大小
      buffer-memory: 33554432
      #序列化
      value-serializer: com.hdwa.sdk.kafka.MsgJsonSerializer
      acks: all
    consumer:
      properties:
        topic: dmpToSdk
        group:
          #默认的消费组ID，设置成不一样的订阅者每个才能收到消息
          id: sdk-#{ T(java.util.UUID).randomUUID().toString() }
        session:
          timeout:
            #消费会话超时时间(超过这个时间consumer没有发送心跳,就会触发rebalance操作)
            ms: 120000
        request:
          timeout:
            #消费请求超时时间
            ms: 180000
      #反序列化
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      #earliest 在各分区下有提交的offset时：从offset处开始消费  在各分区下无提交的offset时：从头开始消费
      #latest 在各分区下有提交的offset时：从offset处开始消费  在各分区下无提交的offset时：从最新的数据开始消费
      auto-offset-reset: latest

    #      报警配置
    alarm:
      ## 是否开启kafka
      enable: true
      producer:
        #生产着topic
        alarm-topic: alarm.edge2alarm
        # 发生错误后，消息重发的次数。
        retries: 2
        #当有多个消息需要被发送到同一个分区时，生产者会把它们放在同一个批次里。该参数指定了一个批次可以使用的内存大小，按照字节数计算。
        batch-size: 65536
        # 设置生产者内存缓冲区的大小。
        buffer-memory: 33554432
        acks: 1
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      consumer:
        #消费者分组id
        alarm-group-id: zkt-alarm-project-${projectId}
        # 消费者topics
        alarm-topic: alarm.alarm2edge
        # 自动提交的时间间隔 在spring boot 2.X 版本中这里采用的是值的类型为Duration 需要符合特定的格式，如1S,1M,2H,5D
        auto-commit-interval: 1S
        # 该属性指定了消费者在读取一个没有偏移量的分区或者偏移量无效的情况下该作何处理：
        # latest（默认值）在偏移量无效的情况下，消费者将从最新的记录开始读取数据（在消费者启动之后生成的记录）
        # earliest ：在偏移量无效的情况下，消费者将从起始位置读取分区的记录
        auto-offset-reset: latest
        # 是否自动提交偏移量，默认值是true,为了避免出现重复数据和数据丢失，可以把它设置为false,然后手动提交偏移量
        enable-auto-commit: false
        heartbeat-interval: 10S
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      listener:
        # 在侦听器容器中运行的线程数。
        concurrency: 5
        #listner负责ack，每调用一次，就立即commit
        ack-mode: manual_immediate
        missing-topics-fatal: false
      properties:
        session:
          timeout:
            ms: 60000
        max:
          poll:
            interval:
              ms: 600000

    control:
      #------------------kafka地址 需要修改
      producer:
        # 发生错误后，消息重发的次数。
        retries: 2
        #当有多个消息需要被发送到同一个分区时，生产者会把它们放在同一个批次里。该参数指定了一个批次可以使用的内存大小，按照字节数计算。
        batch-size: 65536
        # 设置生产者内存缓冲区的大小。
        buffer-memory: 33554432
        acks: 1
        edgeTopic: control.edge2control
      consumer:
        # 自动提交的时间间隔 在spring boot 2.X 版本中这里采用的是值的类型为Duration 需要符合特定的格式，如1S,1M,2H,5D
        auto-commit-interval: 1S
        # 该属性指定了消费者在读取一个没有偏移量的分区或者偏移量无效的情况下该作何处理：
        # latest（默认值）在偏移量无效的情况下，消费者将从最新的记录开始读取数据（在消费者启动之后生成的记录）
        # earliest ：在偏移量无效的情况下，消费者将从起始位置读取分区的记录
        auto-offset-reset: latest
        # 是否自动提交偏移量，默认值是true,为了避免出现重复数据和数据丢失，可以把它设置为false,然后手动提交偏移量
        enable-auto-commit: false
        group-id: project-control-${projectId}
        topics: control.control2edge
        heartbeat-interval: 10S
      listener:
        # 在侦听器容器中运行的线程数。
        concurrency: 5
        #listner负责ack，每调用一次，就立即commit
        ack-mode: manual_immediate
        missing-topics-fatal: false
      properties:
        session:
          timeout:
            ms: 60000
        max:
          poll:
            interval:
              ms: 600000
